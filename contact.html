<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Tiffany</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <h1 class="logo">Tiffany</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="diary.html">Diary</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Header -->
    <section class="hero hero-contact">
        <div class="hero-text">
            <h1>Get In Touch</h1>
            <p>Let's connect! I'd love to hear from you.</p>
        </div>
    </section>

    <!-- Contact Section -->
    <div class="container">
        <div class="contact-grid">
            <!-- Contact Info -->
            <div class="card contact-info">
                <h2>Contact Information</h2>
                <div class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <div>
                        <h4>Email</h4>
                        <p>tiffanypabua@gmail.com</p>
                    </div>
                </div>
                <div class="contact-item">
                    <i class="fas fa-phone"></i>
                    <div>
                        <h4>Phone</h4>
                        <p>+63 912 345 6789</p>
                    </div>
                </div>
                <div class="contact-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <div>
                        <h4>Location</h4>
                        <p>Colegio de Sta. Teresa de Avila, Philippines</p>
                    </div>
                </div>
                <div class="social-links">
                    <a href="#" class="social-btn"><i class="fab fa-facebook"></i></a>
                    <a href="#" class="social-btn"><i class="fab fa-instagram"></i></a>
                </div>
            </div>

            <!-- Contact Form -->
           <div class="card contact-form-card">
    <h2>Send Message</h2>
    <form class="contact-form" id="contactForm">
        <div class="form-group">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
        </div>
        
        <div class="form-group">
            <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
        </div>
        <button type="submit" class="cta-btn full-width">Send Message</button>
        <div id="formMessage" style="margin-top: 1rem; display: none;"></div>
    </form>
</div>
        </div>

</body>
</html>
